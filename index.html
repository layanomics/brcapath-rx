<script>
  // ==========================================================
  // BOOT
  // ==========================================================
  async function boot() {
    setupTabs();

    try {
      const res = await fetch("./demo_predictions.json", { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status} — could not load demo_predictions.json`);
      demoData = await res.json();

      fillStaticContent();
      buildCohortToggle();
      wireControls();
      populateControls(); // also calls renderInteractive()

      el("loading").classList.add("hidden");
      el("app-shell").classList.remove("hidden");
    } catch (err) {
      el("loading").classList.add("hidden");
      const errBox = el("load-error");
      errBox.classList.remove("hidden");
      el("error-msg").textContent = err.message;
    }
  }

  boot();
</script>
